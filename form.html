<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form | Amity University – Lab Work 4</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="index.html">
      <img src="images/amity-logo.png" alt="Amity University logo" class="logo">
      <span class="brand-text">
        <strong>Amity University</strong>
        <span>Web Technologies Lab · Lab Work 4</span>
      </span>
    </a>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="form.html" class="active" aria-current="page">Form</a>
      <a href="table.html">Table</a>
    </nav>
  </div>
</header>

<main class="container container-narrow">

  <section class="card">
    <h1 class="page-title">Page 2: Student Registration Form</h1>
    <p class="lead">
      When you submit, the data is sent to <code>backend/submit.php</code>,
      which checks it and saves it.
    </p>

    <div id="msg" class="alert" role="alert" aria-live="polite" hidden></div>

    <form id="studentForm" method="post" action="../backend/submit.php">
      <div class="form-grid">

        <div class="field">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="e.g. Aarav Sharma"
                 required minlength="2" maxlength="60" autocomplete="name">
        </div>

        <div class="field">
          <label for="enrollment">Enrollment Number</label>
          <input type="text" id="enrollment" name="enrollment" placeholder="e.g. A2305221001"
                 required pattern="[A-Za-z0-9\-]{3,20}"
                 title="3 to 20 letters, digits or hyphens" maxlength="20">
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com"
                 required maxlength="100" autocomplete="email">
        </div>

        <div class="field">
          <label for="course">Course</label>
          <select id="course" name="course" required>
            <option value="">-- Select course --</option>
            <option value="B.Tech CSE">B.Tech CSE</option>
            <option value="BCA">BCA</option>
            <option value="MCA">MCA</option>
            <option value="B.Sc IT">B.Sc IT</option>
          </select>
        </div>

        <div class="field">
          <span class="label" id="gender-label">Gender</span>
          <div class="radio-group" role="radiogroup" aria-labelledby="gender-label">
            <label><input type="radio" name="gender" value="Male" required> Male</label>
            <label><input type="radio" name="gender" value="Female"> Female</label>
            <label><input type="radio" name="gender" value="Other"> Other</label>
          </div>
        </div>

        <div class="field">
          <label for="marks">Marks (0–100)</label>
          <input type="number" id="marks" name="marks" placeholder="e.g. 85"
                 required min="0" max="100" step="1" inputmode="numeric">
        </div>

      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="submitBtn">Submit</button>
        <button type="reset" class="btn btn-secondary">Reset</button>
      </div>
    </form>
  </section>

</main>

<footer class="site-footer">
  <p>&copy; 2026 Amity University · Lab Work 4 · HTML, CSS, JavaScript &amp; PHP</p>
</footer>

<script src="app.js"></script>
</body>
</html>
